{c:`int a=5;\nprintf("%d %d %d", a++, a, ++a);`, a:"unspecified", ex:"Order of evaluation of printf arguments is unspecified in C. If Zoho asks this, write 'undefined / compiler dependent'. GCC typically prints 6 7 7.", alt:["undefined","compiler dependent","6 7 7"]},

{c:`int a[5]={1,2,3,4,5};\nint *p=a;\nprintf("%d", *(p+3));`, a:"4", ex:"p+3 points to a[3]. Arrays are zero-indexed."},
{c:`int a[]={10,20,30,40};\nprintf("%d", *a + 1);`, a:"11", ex:"*a is a[0]=10, then +1. Different from *(a+1) which is 20."},
{c:`int a[]={10,20,30,40};\nprintf("%d", *(a+1));`, a:"20", ex:"Pointer arithmetic moves by element size, so a+1 is a[1]."},
{c:`char s[]="hello";\nprintf("%d", sizeof(s));`, a:"6", ex:"sizeof counts the null terminator: 5 chars + '\\0'."},
{c:`char s[]="hello";\nprintf("%d", strlen(s));`, a:"5", ex:"strlen stops before the null terminator."},
{c:`char *s="hello";\nprintf("%c", *(s+1));`, a:"e", ex:"s+1 points to the second character."},
{c:`int i;\nfor(i=0;i<5;i++);\nprintf("%d", i);`, a:"5", ex:"The semicolon after for makes an empty loop. i ends at 5."},
{c:`int i=0;\nwhile(i++<3) printf("%d ", i);`, a:"1 2 3", ex:"Condition checks i then increments. Body sees the incremented value."},
{c:`int i=0;\nwhile(++i<3) printf("%d ", i);`, a:"1 2", ex:"Pre-increment: checks 1<3, 2<3, then 3<3 fails."},
{c:`int x=5;\nprintf("%d", x++ + x++);`, a:"undefined", ex:"Two modifications without a sequence point. Say undefined; GCC gives 11.", alt:["undefined behaviour","11"]},
{c:`int x=5, y;\ny = x++;\nprintf("%d %d", x, y);`, a:"6 5", ex:"Post-increment returns the old value then increments."},
{c:`int x=5, y;\ny = ++x;\nprintf("%d %d", x, y);`, a:"6 6", ex:"Pre-increment increments first."},
{c:`void f(){ static int c=0; c++; printf("%d ", c); }\nint main(){ f(); f(); f(); }`, a:"1 2 3", ex:"static keeps its value between calls and is initialised once."},
{c:`void f(){ int c=0; c++; printf("%d ", c); }\nint main(){ f(); f(); f(); }`, a:"1 1 1", ex:"Without static, c is re-created at 0 every call."},
{c:`int f(int n){ if(n==0) return 0; return n + f(n-1); }\nint main(){ printf("%d", f(4)); }`, a:"10", ex:"4+3+2+1+0 = 10."},
{c:`void f(int n){ if(n==0) return; printf("%d ", n); f(n-1); }\nint main(){ f(3); }`, a:"3 2 1", ex:"Print happens before the recursive call."},
{c:`void f(int n){ if(n==0) return; f(n-1); printf("%d ", n); }\nint main(){ f(3); }`, a:"1 2 3", ex:"Print happens after the recursive call, so it unwinds in reverse."},

{c:`int a=10;\nif(a=0) printf("yes"); else printf("no");`, a:"no", ex:"Assignment, not comparison. a becomes 0, which is false."},
{c:`int a=10;\nif(a=5) printf("yes"); else printf("no");`, a:"yes", ex:"a=5 assigns 5, non-zero is true."},
{c:`int x=3;\nswitch(x){ case 1: printf("A"); case 3: printf("B"); case 4: printf("C"); break; default: printf("D"); }`, a:"BC", ex:"No break after case 3, so it falls through to case 4."},
{c:`printf("%d", 7/2);`, a:"3", ex:"Integer division truncates."},
{c:`printf("%.1f", 7/2.0);`, a:"3.5", ex:"One operand is double so division is floating point."},
{c:`printf("%d", -7 % 3);`, a:"-1", ex:"In C, % takes the sign of the dividend."},
{c:`printf("%d", 5 & 3);`, a:"1", ex:"101 & 011 = 001."},
{c:`printf("%d", 5 | 3);`, a:"7", ex:"101 | 011 = 111."},
{c:`printf("%d", 5 ^ 3);`, a:"6", ex:"101 ^ 011 = 110."},
{c:`printf("%d", 1 << 3);`, a:"8", ex:"Left shift by 3 multiplies by 8."},
{c:`printf("%d", 10 > 5 > 2);`, a:"0", ex:"(10>5) is 1, then 1>2 is 0."},
{c:`int a=5;\nprintf("%d", a==5 ? 1 : 0);`, a:"1", ex:"Ternary."},
{c:`printf("%d", sizeof(int));`, a:"4", ex:"On the compilers Zoho uses, int is 4 bytes."},
{c:`printf("%d", sizeof('A'));`, a:"4", ex:"In C, a character constant has type int. In C++ it would be 1."},
{c:`printf("%c", 'A'+1);`, a:"B", ex:"Characters are integers. 65+1 = 66 = 'B'."},
{c:`printf("%d", 'A');`, a:"65", ex:"ASCII value of A."},
{c:`char c='a';\nprintf("%c", c-32);`, a:"A", ex:"Lowercase to uppercase differ by 32 in ASCII."},
{c:`int a[3]={1,2,3};\nprintf("%d", a[3]);`, a:"garbage", ex:"Out of bounds. Undefined. Write 'garbage / undefined'.", alt:["undefined","garbage value"]},
{c:`int a[2][2]={{1,2},{3,4}};\nprintf("%d", a[1][0]);`, a:"3", ex:"Second row, first column."},
{c:`int a[2][2]={{1,2},{3,4}};\nprintf("%d", *(*(a+1)+1));`, a:"4", ex:"*(a+1) is row 1, +1 is column 1."},
{c:`int a=5; int *p=&a; int **q=&p;\nprintf("%d", **q);`, a:"5", ex:"Double dereference goes back to a."},
{c:`int a=5, b=10;\nint *p=&a; *p=b;\nprintf("%d", a);`, a:"10", ex:"Writing through the pointer changes a."},
{c:`void swap(int a,int b){ int t=a; a=b; b=t; }\nint main(){ int x=1,y=2; swap(x,y); printf("%d %d", x, y); }`, a:"1 2", ex:"Pass by value. The originals are untouched."},
{c:`void swap(int *a,int *b){ int t=*a; *a=*b; *b=t; }\nint main(){ int x=1,y=2; swap(&x,&y); printf("%d %d", x, y); }`, a:"2 1", ex:"Pass by pointer changes the originals."},
{c:`int i;\nfor(i=1;i<=3;i++){ if(i==2) continue; printf("%d ", i); }`, a:"1 3", ex:"continue skips the print for i=2."},
{c:`int i;\nfor(i=1;i<=3;i++){ if(i==2) break; printf("%d ", i); }`, a:"1", ex:"break exits the loop entirely."},
{c:`int i=5;\ndo{ printf("%d ", i); i++; }while(i<3);`, a:"5", ex:"do-while runs the body once before checking."},
{c:`char s[]="abc";\nchar *p=s;\np++;\nprintf("%s", p);`, a:"bc", ex:"%s prints from the pointer to the null terminator."},
{c:`printf("%d", strcmp("abc","abd"));`, a:"negative", ex:"'c' < 'd', so a negative value. GCC typically returns -1. Write 'negative (-1)'.", alt:["-1","<0"]},
{c:`int x=0;\nprintf("%d %d", x, x=5);`, a:"unspecified", ex:"Argument evaluation order is unspecified. Typically 5 5 on GCC.", alt:["undefined","5 5"]},
{c:`printf("%d", 010);`, a:"8", ex:"A leading zero makes it octal."},
{c:`printf("%d", 0x10);`, a:"16", ex:"Hexadecimal."},
{c:`float f=0.1;\nif(f==0.1) printf("eq"); else printf("neq");`, a:"neq", ex:"0.1 literal is double; float 0.1 is not exactly equal to it."},
{c:`int a=5;\nprintf("%d", !a);`, a:"0", ex:"Logical NOT of non-zero is 0."},
{c:`int a=5;\nprintf("%d", ~a);`, a:"-6", ex:"Bitwise NOT: ~x = -(x+1)."},
{c:`int i=3;\nprintf("%d", i---1);`, a:"2", ex:"Parsed as (i--) - 1 = 3-1."},
{c:`int a[]={1,2,3,4,5};\nprintf("%d", sizeof(a)/sizeof(a[0]));`, a:"5", ex:"Standard idiom for array length."},
{c:`int a[]={1,2,3,4,5};\nint *p=a;\nprintf("%d", sizeof(p)/sizeof(p[0]));`, a:"2", ex:"sizeof a pointer is 8 on 64-bit, /4 = 2. Trap question. On 32-bit Turbo C it is 1.", alt:["1"]},
{c:`char *s="hello";\ns[0]='H';\nprintf("%s", s);`, a:"crash", ex:"String literals are read-only. Writing to one is undefined, usually a segfault.", alt:["undefined","segmentation fault","runtime error"]},
{c:`int main(){ int x; printf("%d", x); }`, a:"garbage", ex:"Uninitialised local variable.", alt:["undefined","garbage value"]},
];

// ---------- ROUND 2: CODING (function name, tests as [args, expected]) ----------
const CODE = [
{t:"Reverse a string", lv:1, fn:"rev", s:"Return the reversed string. No slicing, no reversed(). Use a loop.", ex:'rev("hello") -> "olleh"', hint:"Walk from the last index to 0 and append.", tests:[[["hello"],"olleh"],[["a"],"a"],[[""],""]], sol:`def rev(s):\n    out = ""\n    i = len(s) - 1\n    while i >= 0:\n        out += s[i]\n        i -= 1\n    return out`},
{t:"Count vowels", lv:1, fn:"vowels", s:"Return number of vowels (a,e,i,o,u, any case).", ex:'vowels("Zoho Corp") -> 3', hint:"Lowercase each char, check membership.", tests:[[["Zoho Corp"],3],[["xyz"],0]], sol:`def vowels(s):\n    n = 0\n    for ch in s:\n        if ch.lower() in "aeiou":\n            n += 1\n    return n`},
{t:"Prime check", lv:1, fn:"is_prime", s:"Return True if n is prime.", ex:"is_prime(7) -> True", hint:"Check divisors up to sqrt(n).", tests:[[[7],true],[[1],false],[[25],false],[[2],true]], sol:`def is_prime(n):\n    if n < 2:\n        return False\n    i = 2\n    while i * i <= n:\n        if n % i == 0:\n            return False\n        i += 1\n    return True`},
{t:"Factorial (recursive)", lv:1, fn:"fact", s:"Return n! using recursion.", ex:"fact(5) -> 120", hint:"fact(0)=1.", tests:[[[5],120],[[0],1]], sol:`def fact(n):\n    if n <= 1:\n        return 1\n    return n * fact(n - 1)`},
{t:"Fibonacci list", lv:1, fn:"fib", s:"Return the first n Fibonacci numbers as a list starting 0,1.", ex:"fib(6) -> [0,1,1,2,3,5]", hint:"Keep two variables.", tests:[[[6],[0,1,1,2,3,5]],[[1],[0]]], sol:`def fib(n):\n    out = []\n    a, b = 0, 1\n    for _ in range(n):\n        out.append(a)\n        a, b = b, a + b\n    return out`},
{t:"Palindrome without slicing", lv:1, fn:"is_pal", s:"Return True if s reads the same forwards and backwards. Ignore case. No slicing.", ex:'is_pal("Madam") -> True', hint:"Two pointers from each end.", tests:[[["Madam"],true],[["abc"],false],[["a"],true]], sol:`def is_pal(s):\n    s = s.lower()\n    i, j = 0, len(s) - 1\n    while i < j:\n        if s[i] != s[j]:\n            return False\n        i += 1\n        j -= 1\n    return True`},

{t:"Anagram check", lv:1, fn:"anagram", s:"Return True if the two strings are anagrams. No sorted().", ex:'anagram("listen","silent") -> True', hint:"Compare frequency dicts.", tests:[[["listen","silent"],true],[["abc","abd"],false]], sol:`def anagram(a, b):\n    if len(a) != len(b):\n        return False\n    d = {}\n    for ch in a:\n        d[ch] = d.get(ch, 0) + 1\n    for ch in b:\n        if d.get(ch, 0) == 0:\n            return False\n        d[ch] -= 1\n    return True`},

{t:"Odd-repeating characters", lv:2, fn:"odd_rep", s:"Return characters that appear an odd number of times, in first-seen order. (Asked in a ZLabs written round.)", ex:'odd_rep("datastructure") -> "dtsce"', hint:"Count, then keep chars with odd count once each.", tests:[[["datastructure"],"dtsce"],[["aab"],"b"]], sol:`def odd_rep(s):\n    d = {}\n    for ch in s:\n        d[ch] = d.get(ch, 0) + 1\n    out = ""\n    seen = set()\n    for ch in s:\n        if d[ch] % 2 == 1 and ch not in seen:\n            out += ch\n            seen.add(ch)\n    return out`},
{t:"Reverse words", lv:2, fn:"rev_words", s:"Reverse the order of words. Single spaces.", ex:'rev_words("the sky is blue") -> "blue is sky the"', hint:"Split manually or use split, then build backwards.", tests:[[["the sky is blue"],"blue is sky the"],[["a"],"a"]], sol:`def rev_words(s):\n    words = s.split(" ")\n    out = ""\n    i = len(words) - 1\n    while i >= 0:\n        out += words[i]\n        if i > 0:\n            out += " "\n        i -= 1\n    return out`},
{t:"Balanced parentheses", lv:2, fn:"balanced", s:"Return True if every ( [ { is closed in order.", ex:'balanced("{[()]}") -> True', hint:"Stack. Push openers, pop and match closers.", tests:[[["{[()]}"],true],[["([)]"],false],[["(("],false],[[""],true]], sol:`def balanced(s):\n    st = []\n    pair = {")": "(", "]": "[", "}": "{"}\n    for ch in s:\n        if ch in "([{":\n            st.append(ch)\n        elif ch in pair:\n            if not st or st[-1] != pair[ch]:\n                return False\n            st.pop()\n    return len(st) == 0`},
{t:"Remove unbalanced parentheses", lv:3, fn:"remove_unbal", s:"Remove the minimum parentheses so the rest is balanced (only round brackets). Keep letters.", ex:'remove_unbal("((ab)") -> "(ab)"', hint:"Mark indices of unmatched ( and ) using a stack, then rebuild without them.", tests:[[["((ab)"],"(ab)"],[["a)b(c)"],"ab(c)"],[["(())"],"(())"]], sol:`def remove_unbal(s):\n    st = []\n    bad = set()\n    for i, ch in enumerate(s):\n        if ch == "(":\n            st.append(i)\n        elif ch == ")":\n            if st:\n                st.pop()\n            else:\n                bad.add(i)\n    bad.update(st)\n    return "".join(ch for i, ch in enumerate(s) if i not in bad)`},
{t:"Alternate sort", lv:2, fn:"alt_sort", s:"Return list as max, min, second max, second min, ...", ex:"alt_sort([1,2,3,4,5]) -> [5,1,4,2,3]", hint:"Sort by hand (bubble), then take from both ends.", tests:[[[[1,2,3,4,5]],[5,1,4,2,3]],[[[4,1]],[4,1]]], sol:`def alt_sort(a):\n    a = list(a)\n    n = len(a)\n    for i in range(n):\n        for j in range(n - 1 - i):\n            if a[j] > a[j + 1]:\n                a[j], a[j + 1] = a[j + 1], a[j]\n    out = []\n    i, j = 0, n - 1\n    while i <= j:\n        out.append(a[j])\n        if i != j:\n            out.append(a[i])\n        i += 1\n        j -= 1\n    return out`},
{t:"Merge sorted arrays, no duplicates", lv:2, fn:"merge_uniq", s:"Merge two sorted lists into one sorted list without duplicates.", ex:"merge_uniq([1,2,4],[2,3,4]) -> [1,2,3,4]", hint:"Two pointers; skip a value equal to the last pushed.", tests:[[[[1,2,4],[2,3,4]],[1,2,3,4]],[[[],[1,1]],[1]]], sol:`def merge_uniq(a, b):\n    i = j = 0\n    out = []\n    def push(v):\n        if not out or out[-1] != v:\n            out.append(v)\n    while i < len(a) and j < len(b):\n        if a[i] < b[j]:\n            push(a[i]); i += 1\n        else:\n            push(b[j]); j += 1\n    while i < len(a):\n        push(a[i]); i += 1\n    while j < len(b):\n        push(b[j]); j += 1\n    return out`},
{t:"Second largest", lv:1, fn:"second_largest", s:"Return the second largest distinct value, or None.", ex:"second_largest([3,5,5,1]) -> 3", hint:"Track first and second in one pass.", tests:[[[[3,5,5,1]],3],[[[1]],null]], sol:`def second_largest(a):\n    first = second = None\n    for v in a:\n        if first is None or v > first:\n            second = first\n            first = v\n        elif v != first and (second is None or v > second):\n            second = v\n    return second`},
{t:"Rotate array right by k", lv:2, fn:"rotate", s:"Rotate right by k without slicing.", ex:"rotate([1,2,3,4,5],2) -> [4,5,1,2,3]", hint:"New index (i+k)%n.", tests:[[[[1,2,3,4,5],2],[4,5,1,2,3]],[[[1,2],3],[2,1]]], sol:`def rotate(a, k):\n    n = len(a)\n    out = [0] * n\n    for i in range(n):\n        out[(i + k) % n] = a[i]\n    return out`},
{t:"Spiral matrix", lv:3, fn:"spiral", s:"Return elements of a matrix in clockwise spiral order.", ex:"spiral([[1,2,3],[4,5,6],[7,8,9]]) -> [1,2,3,6,9,8,7,4,5]", hint:"Four boundaries: top, bottom, left, right. Shrink after each side.", tests:[[[[[1,2,3],[4,5,6],[7,8,9]]],[1,2,3,6,9,8,7,4,5]],[[[[1,2],[3,4]]],[1,2,4,3]]], sol:`def spiral(m):\n    out = []\n    if not m:\n        return out\n    top, bot = 0, len(m) - 1\n    left, right = 0, len(m[0]) - 1\n    while top <= bot and left <= right:\n        for c in range(left, right + 1):\n            out.append(m[top][c])\n        top += 1\n        for r in range(top, bot + 1):\n            out.append(m[r][right])\n        right -= 1\n        if top <= bot:\n            for c in range(right, left - 1, -1):\n                out.append(m[bot][c])\n            bot -= 1\n        if left <= right:\n            for r in range(bot, top - 1, -1):\n                out.append(m[r][left])\n            left += 1\n    return out`},
{t:"Rotate matrix 90° clockwise", lv:3, fn:"rot90", s:"Return the matrix rotated 90° clockwise.", ex:"rot90([[1,2],[3,4]]) -> [[3,1],[4,2]]", hint:"new[c][n-1-r] = old[r][c].", tests:[[[[[1,2],[3,4]]],[[3,1],[4,2]]]], sol:`def rot90(m):\n    n = len(m)\n    out = [[0] * n for _ in range(n)]\n    for r in range(n):\n        for c in range(n):\n            out[c][n - 1 - r] = m[r][c]\n    return out`},
{t:"Transpose", lv:1, fn:"transpose", s:"Return the transpose of an r×c matrix.", ex:"transpose([[1,2,3],[4,5,6]]) -> [[1,4],[2,5],[3,6]]", hint:"out[c][r] = m[r][c].", tests:[[[[[1,2,3],[4,5,6]]],[[1,4],[2,5],[3,6]]]], sol:`def transpose(m):\n    r, c = len(m), len(m[0])\n    out = [[0] * r for _ in range(c)]\n    for i in range(r):\n        for j in range(c):\n            out[j][i] = m[i][j]\n    return out`},
{t:"Pattern in matrix", lv:3, fn:"has_pattern", s:"Return True if small matrix p appears inside big matrix m (exact sub-block). Asked in a ZLabs written round.", ex:"has_pattern([[1,2],[3,4]],[[2],[4]]) -> True", hint:"Try every top-left start, compare block.", tests:[[[[[1,2],[3,4]],[[2],[4]]],true],[[[[1,2],[3,4]],[[4,3]]],false]], sol:`def has_pattern(m, p):\n    R, C = len(m), len(m[0])\n    r, c = len(p), len(p[0])\n    for i in range(R - r + 1):\n        for j in range(C - c + 1):\n            ok = True\n            for x in range(r):\n                for y in range(c):\n                    if m[i + x][j + y] != p[x][y]:\n                        ok = False\n                        break\n                if not ok:\n                    break\n            if ok:\n                return True\n    return False`},
{t:"Decode string 3[a2[bc]]", lv:3, fn:"decode", s:"Decode k[encoded] with nesting. Asked in Zoho 2025 round 2.", ex:'decode("3[a2[bc]]") -> "abcbcabcbcabcbc"', hint:"Stack of (prev_string, repeat_count). On ']' pop and multiply.", tests:[[["3[a2[bc]]"],"abcbcabcbcabcbc"],[["2[ab]c"],"ababc"]], sol:`def decode(s):\n    st = []\n    cur = ""\n    num = 0\n    for ch in s:\n        if ch.isdigit():\n            num = num * 10 + int(ch)\n        elif ch == "[":\n            st.append((cur, num))\n            cur, num = "", 0\n        elif ch == "]":\n            prev, k = st.pop()\n            cur = prev + cur * k\n        else:\n            cur += ch\n    return cur`},
{t:"Group anagrams", lv:2, fn:"group_anagrams", s:"Group words that are anagrams. Return list of groups in first-seen order, each group in input order. Asked in Zoho 2024 round 2.", ex:'group_anagrams(["eat","tea","tan","ate","nat"]) -> [["eat","tea","ate"],["tan","nat"]]', hint:"Key = sorted letters string.", tests:[[[["eat","tea","tan","ate","nat"]],[["eat","tea","ate"],["tan","nat"]]]], sol:`def group_anagrams(words):\n    d = {}\n    order = []\n    for w in words:\n        key = "".join(sorted(w))\n        if key not in d:\n            d[key] = []\n            order.append(key)\n        d[key].append(w)\n    return [d[k] for k in order]`},
{t:"Longest palindromic substring", lv:3, fn:"longest_pal", s:"Return the longest palindromic substring (first one if tie).", ex:'longest_pal("babad") -> "bab"', hint:"Expand around every centre (odd and even).", tests:[[["babad"],"bab"],[["cbbd"],"bb"],[["a"],"a"]], sol:`def longest_pal(s):\n    best = ""\n    for i in range(len(s)):\n        for l, r in ((i, i), (i, i + 1)):\n            while l >= 0 and r < len(s) and s[l] == s[r]:\n                l -= 1\n                r += 1\n            cand = s[l + 1:r]\n            if len(cand) > len(best):\n                best = cand\n    return best`},
{t:"Max profit, one buy one sell", lv:2, fn:"max_profit", s:"Given daily prices, return max profit from one buy then one sell. 0 if none.", ex:"max_profit([7,1,5,3,6,4]) -> 5", hint:"Track min so far and best diff.", tests:[[[[7,1,5,3,6,4]],5],[[[5,4,3]],0]], sol:`def max_profit(p):\n    lo = p[0]\n    best = 0\n    for v in p[1:]:\n        if v - lo > best:\n            best = v - lo\n        if v < lo:\n            lo = v\n    return best`},
{t:"Max of window minimums", lv:3, fn:"max_of_mins", s:"For every contiguous window of length k, take its minimum; return the largest of those. (PrepInsta Zoho advanced set.)", ex:"max_of_mins([1,3,2,5,4],2) -> 4", hint:"Brute force is fine for round 2; explain the deque optimisation if asked.", tests:[[[[1,3,2,5,4],2],4],[[[5,1,5],1],5]], sol:`def max_of_mins(a, k):\n    best = None\n    for i in range(len(a) - k + 1):\n        m = a[i]\n        for j in range(i, i + k):\n            if a[j] < m:\n                m = a[j]\n        if best is None or m > best:\n            best = m\n    return best`},
{t:"Minimum starting capital", lv:2, fn:"min_capital", s:"Sequence of wins/losses (positive/negative ints). Return the minimum starting coins so the balance never drops below 0.", ex:"min_capital([-5,3,-4]) -> 6", hint:"Track running sum; answer is -(lowest running sum), at least 0.", tests:[[[[-5,3,-4]],6],[[[2,3]],0]], sol:`def min_capital(g):\n    run = 0\n    low = 0\n    for v in g:\n        run += v\n        if run < low:\n            low = run\n    return -low`},
{t:"Numbers using only 3 and 4", lv:2, fn:"three_four", s:"Return the first n numbers made only of digits 3 and 4 in increasing order.", ex:"three_four(6) -> [3,4,33,34,43,44]", hint:"BFS: start with 3,4; append '3' and '4' to each.", tests:[[[6],[3,4,33,34,43,44]]], sol:`def three_four(n):\n    out = []\n    q = ["3", "4"]\n    while len(out) < n:\n        s = q.pop(0)\n        out.append(int(s))\n        q.append(s + "3")\n        q.append(s + "4")\n    return out`},
{t:"Binary search", lv:1, fn:"bsearch", s:"Return index of target in sorted list, or -1.", ex:"bsearch([1,3,5,7],5) -> 2", hint:"lo, hi, mid.", tests:[[[[1,3,5,7],5],2],[[[1,3,5,7],4],-1]], sol:`def bsearch(a, t):\n    lo, hi = 0, len(a) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if a[mid] == t:\n            return mid\n        if a[mid] < t:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1`},
{t:"Bubble sort", lv:1, fn:"bsort", s:"Sort ascending without sorted()/sort().", ex:"bsort([3,1,2]) -> [1,2,3]", hint:"Swap adjacent pairs, n passes.", tests:[[[[3,1,2]],[1,2,3]],[[[]],[]]], sol:`def bsort(a):\n    a = list(a)\n    n = len(a)\n    for i in range(n):\n        for j in range(n - 1 - i):\n            if a[j] > a[j + 1]:\n                a[j], a[j + 1] = a[j + 1], a[j]\n    return a`},
{t:"Two sum", lv:1, fn:"two_sum", s:"Return indices [i,j] (i<j) of two numbers adding to target, or [].", ex:"two_sum([2,7,11,15],9) -> [0,1]", hint:"Dict of value to index.", tests:[[[[2,7,11,15],9],[0,1]],[[[1,2],5],[]]], sol:`def two_sum(a, t):\n    seen = {}\n    for i, v in enumerate(a):\n        if t - v in seen:\n            return [seen[t - v], i]\n        seen[v] = i\n    return []`},
{t:"Sum of digits until single digit", lv:1, fn:"digital_root", s:"Repeatedly sum digits until one digit remains.", ex:"digital_root(9875) -> 2", hint:"Loop while n >= 10.", tests:[[[9875],2],[[0],0]], sol:`def digital_root(n):\n    while n >= 10:\n        s = 0\n        while n > 0:\n            s += n % 10\n            n //= 10\n        n = s\n    return n`},
{t:"Armstrong number", lv:1, fn:"armstrong", s:"True if sum of digits^len equals n.", ex:"armstrong(153) -> True", hint:"Count digits first.", tests:[[[153],true],[[10],false]], sol:`def armstrong(n):\n    digits = str(n)\n    k = len(digits)\n    total = 0\n    for d in digits:\n        total += int(d) ** k\n    return total == n`},
{t:"Sort 0s 1s 2s", lv:2, fn:"sort012", s:"Sort a list containing only 0,1,2 without sorted().", ex:"sort012([2,0,1,2,0]) -> [0,0,1,2,2]", hint:"Count each, rebuild. Or Dutch flag.", tests:[[[[2,0,1,2,0]],[0,0,1,2,2]]], sol:`def sort012(a):\n    c = [0, 0, 0]\n    for v in a:\n        c[v] += 1\n    return [0] * c[0] + [1] * c[1] + [2] * c[2]`},
{t:"Move zeros to end", lv:1, fn:"move_zeros", s:"Keep order of non-zeros, zeros at end.", ex:"move_zeros([0,1,0,3]) -> [1,3,0,0]", hint:"Write pointer.", tests:[[[[0,1,0,3]],[1,3,0,0]]], sol:`def move_zeros(a):\n    out = [v for v in a if v != 0]\n    return out + [0] * (len(a) - len(out))`},
{t:"Kadane: max subarray sum", lv:2, fn:"max_sub", s:"Return the maximum sum of any contiguous subarray.", ex:"max_sub([-2,1,-3,4,-1,2,1,-5,4]) -> 6", hint:"cur = max(v, cur+v).", tests:[[[[-2,1,-3,4,-1,2,1,-5,4]],6],[[[-3,-1]],-1]], sol:`def max_sub(a):\n    cur = best = a[0]\n    for v in a[1:]:\n        cur = v if v > cur + v else cur + v\n        if cur > best:\n            best = cur\n    return best`},
{t:"Topological order (Kahn)", lv:3, fn:"topo", s:"Given n nodes 0..n-1 and edges [u,v] meaning u before v, return one valid order (smallest node first when tied). Asked in Zoho 2025 round 2.", ex:"topo(3,[[0,1],[1,2]]) -> [0,1,2]", hint:"Indegree count, queue of zero-indegree nodes, pick the smallest each time.", tests:[[[3,[[0,1],[1,2]]],[0,1,2]],[[3,[[2,0]]],[1,2,0]]], sol:`def topo(n, edges):\n    adj = [[] for _ in range(n)]\n    indeg = [0] * n\n    for u, v in edges:\n        adj[u].append(v)\n        indeg[v] += 1\n    out = []\n    while len(out) < n:\n        pick = -1\n        for i in range(n):\n            if indeg[i] == 0 and i not in out:\n                pick = i\n                break\n        if pick == -1:\n            break\n        out.append(pick)\n        indeg[pick] = -1\n        for v in adj[pick]:\n            indeg[v] -= 1\n    return out`},
{t:"Greater on right side", lv:2, fn:"greater_right", s:"Replace each element with the greatest element to its right; last becomes -1. (Repo Q1.)", ex:"greater_right([16,17,4,3,5,2]) -> [17,5,5,5,2,-1]", hint:"Scan from the right, keep max so far.", tests:[[[[16,17,4,3,5,2]],[17,5,5,5,2,-1]],[[[1]],[-1]]], sol:`def greater_right(a):\n    out = [0] * len(a)\n    mx = -1\n    for i in range(len(a) - 1, -1, -1):\n        out[i] = mx\n        if a[i] > mx:\n            mx = a[i]\n    return out`},
{t:"Equilibrium index", lv:2, fn:"equilibrium", s:"Return the index where left sum equals right sum, or -1. (Repo Q3.)", ex:"equilibrium([-7,1,5,2,-4,3,0]) -> 3", hint:"total - left - a[i] == left.", tests:[[[[-7,1,5,2,-4,3,0]],3],[[[1,2,3]],-1]], sol:`def equilibrium(a):\n    total = sum(a)\n    left = 0\n    for i, v in enumerate(a):\n        if left == total - left - v:\n            return i\n        left += v\n    return -1`},
{t:"Zig-zag matrix", lv:3, fn:"zigzag", s:"Print the matrix along anti-diagonals, alternating direction. (Repo Q5.)", ex:"zigzag([[1,2,3],[4,5,6],[7,8,9]]) -> [1,2,4,7,5,3,6,8,9]", hint:"Group cells by r+c; reverse every odd group.", tests:[[[[[1,2,3],[4,5,6],[7,8,9]]],[1,2,4,7,5,3,6,8,9]]], sol:`def zigzag(m):\n    R, C = len(m), len(m[0])\n    out = []\n    for d in range(R + C - 1):\n        cells = []\n        for r in range(R):\n            c = d - r\n            if 0 <= c < C:\n                cells.append(m[r][c])\n        if d % 2 == 0:\n            cells.reverse()\n        out.extend(cells)\n    return out`},
{t:"Compare version numbers", lv:2, fn:"compare_version", s:"Return 'upgraded', 'downgraded' or 'not changed' comparing v1 to v2 like 4.8.2 vs 4.8.4. (Repo Q7.)", ex:'compare_version("4.8.2","4.8.4") -> "upgraded"', hint:"Split on '.', compare ints part by part, pad with 0.", tests:[[["4.8.2","4.8.4"],"upgraded"],[["4.0.2","3.9"],"downgraded"],[["1.0","1.0.0"],"not changed"]], sol:`def compare_version(v1, v2):\n    a = [int(x) for x in v1.split(".")]\n    b = [int(x) for x in v2.split(".")]\n    while len(a) < len(b): a.append(0)\n    while len(b) < len(a): b.append(0)\n    for x, y in zip(a, b):\n        if y > x: return "upgraded"\n        if y < x: return "downgraded"\n    return "not changed"`},
{t:"Subsets with given sum", lv:3, fn:"subsets_sum", s:"Return all subsets (as lists, in index order) whose sum equals target. (Repo Q8/Q19.)", ex:"subsets_sum([1,2,3],3) -> [[1,2],[3]]", hint:"Recursion: include or exclude each element.", tests:[[[[1,2,3],3],[[1,2],[3]]],[[[2],5],[]]], sol:`def subsets_sum(a, t):\n    out = []\n    def go(i, cur, s):\n        if i == len(a):\n            if s == t and cur:\n                out.append(list(cur))\n            return\n        cur.append(a[i]); go(i + 1, cur, s + a[i]); cur.pop()\n        go(i + 1, cur, s)\n    go(0, [], 0)\n    return out`},
{t:"Chocolates and wrappers", lv:1, fn:"chocolates", s:"With money m, price p, and w wrappers exchangeable for one chocolate, return [total eaten, wrappers left]. (Repo Q10.)", ex:"chocolates(15,1,3) -> [22,1]", hint:"Loop while wrappers >= w.", tests:[[[15,1,3],[22,1]],[[10,2,5],[6,1]]], sol:`def chocolates(m, p, w):\n    eaten = m // p\n    wr = eaten\n    while wr >= w:\n        new = wr // w\n        eaten += new\n        wr = wr % w + new\n    return [eaten, wr]`},
{t:"Word with odd letters (pattern)", lv:2, fn:"odd_word", s:"For an odd-length word, return rows forming an X: row i has word[i] at column i and word[n-1-i] at column n-1-i, spaces elsewhere. (Repo Q13.)", ex:'odd_word("ABC") -> ["A C"," B ","A C"]', hint:"Two indices per row; use a list of spaces.", tests:[[["ABC"],["A C"," B ","A C"]],[["PROGRAM"],["P     M"," R   A ","  O R  ","   G   ","  O R  "," R   A ","P     M"]]], sol:`def odd_word(w):\n    n = len(w)\n    rows = []\n    for i in range(n):\n        row = [" "] * n\n        row[i] = w[i]\n        row[n - 1 - i] = w[n - 1 - i]\n        rows.append("".join(row))\n    return rows`},
{t:"Next greater element", lv:2, fn:"next_greater", s:"For each element, the first greater element to its right, else -1. (Repo Q50.)", ex:"next_greater([4,5,2,25]) -> [5,25,25,-1]", hint:"Brute force is fine; stack for O(n).", tests:[[[[4,5,2,25]],[5,25,25,-1]],[[[13,7,6,12]],[-1,12,12,-1]]], sol:`def next_greater(a):\n    out = [-1] * len(a)\n    st = []\n    for i, v in enumerate(a):\n        while st and a[st[-1]] < v:\n            out[st.pop()] = v\n        st.append(i)\n    return out`},
{t:"Reverse only vowels", lv:1, fn:"rev_vowels", s:"Reverse the vowels in a string, leaving other characters in place. (Repo Q90.)", ex:'rev_vowels("hello") -> "holle"', hint:"Two pointers that skip non-vowels.", tests:[[["hello"],"holle"],[["zoho"],"zoho"],[["aA"],"Aa"]], sol:`def rev_vowels(s):\n    s = list(s)\n    i, j = 0, len(s) - 1\n    V = "aeiouAEIOU"\n    while i < j:\n        if s[i] not in V: i += 1\n        elif s[j] not in V: j -= 1\n        else:\n            s[i], s[j] = s[j], s[i]\n            i += 1; j -= 1\n    return "".join(s)`},
{t:"Odd ascending, even descending", lv:2, fn:"odd_even_sort", s:"Sort odd numbers ascending and even numbers descending, keeping odd positions for odds and even positions for evens... simpler version asked: return odds ascending followed by evens descending. (Repo Q61.)", ex:"odd_even_sort([5,2,8,1,3,4]) -> [1,3,5,8,4,2]", hint:"Split, sort by hand, concat.", tests:[[[[5,2,8,1,3,4]],[1,3,5,8,4,2]]], sol:`def odd_even_sort(a):\n    odds = [v for v in a if v % 2]\n    evens = [v for v in a if v % 2 == 0]\n    for arr, desc in ((odds, False), (evens, True)):\n        n = len(arr)\n        for i in range(n):\n            for j in range(n - 1 - i):\n                if (arr[j] > arr[j + 1]) != desc:\n                    arr[j], arr[j + 1] = arr[j + 1], arr[j]\n    return odds + evens`},
{t:"Top three repeated", lv:2, fn:"top3", s:"Return the three most frequent numbers, most frequent first (tie: smaller number first). (Repo Q53.)", ex:"top3([3,4,2,3,16,3,15,16,15,15,16,2,3]) -> [3,15,16]", hint:"Count with a dict, then sort by (-count, value).", tests:[[[[3,4,2,3,16,3,15,16,15,15,16,2,3]],[3,15,16]]], sol:`def top3(a):\n    d = {}\n    for v in a:\n        d[v] = d.get(v, 0) + 1\n    items = sorted(d.items(), key=lambda kv: (-kv[1], kv[0]))\n    return [k for k, _ in items[:3]]`},
{t:"Twisted prime", lv:1, fn:"twisted_prime", s:"True if n is prime and its reverse is also prime. (Repo Q43.)", ex:"twisted_prime(13) -> True", hint:"Reuse is_prime.", tests:[[[13],true],[[23],false],[[2],true]], sol:`def twisted_prime(n):\n    def ip(x):\n        if x < 2: return False\n        i = 2\n        while i * i <= x:\n            if x % i == 0: return False\n            i += 1\n        return True\n    r = 0\n    m = n\n    while m:\n        r = r * 10 + m % 10\n        m //= 10\n    return ip(n) and ip(r)`},
{t:"Pangram check", lv:1, fn:"pangram", s:"True if the sentence uses every letter a-z. (Repo Q31.)", ex:'pangram("The quick brown fox jumps over the lazy dog") -> True', hint:"Set of lowercase letters, size 26.", tests:[[["The quick brown fox jumps over the lazy dog"],true],[["hello"],false]], sol:`def pangram(s):\n    seen = set()\n    for ch in s.lower():\n        if "a" <= ch <= "z":\n            seen.add(ch)\n    return len(seen) == 26`},
{t:"Number of islands", lv:3, fn:"islands", s:"Grid of 1 (land) and 0 (water). Count connected land groups (4-directional). (Repo Q18.)", ex:"islands([[1,1,0],[0,0,1],[1,0,1]]) -> 3", hint:"DFS/flood fill marking visited.", tests:[[[[[1,1,0],[0,0,1],[1,0,1]]],3],[[[[0]]],0]], sol:`def islands(g):\n    R, C = len(g), len(g[0])\n    seen = [[False] * C for _ in range(R)]\n    def fill(r, c):\n        st = [(r, c)]\n        while st:\n            x, y = st.pop()\n            if 0 <= x < R and 0 <= y < C and g[x][y] == 1 and not seen[x][y]:\n                seen[x][y] = True\n                st += [(x+1,y),(x-1,y),(x,y+1),(x,y-1)]\n    n = 0\n    for r in range(R):\n        for c in range(C):\n            if g[r][c] == 1 and not seen[r][c]:\n                n += 1\n                fill(r, c)\n    return n`},
{t:"Reverse string keeping special chars in place", lv:2, fn:"rev_keep", s:"Reverse only the letters; non-letters stay at their index. (Repo Q28/Q105.)", ex:'rev_keep("a,b$c") -> "c,b$a"', hint:"Two pointers that skip non-letters.", tests:[[["a,b$c"],"c,b$a"],[["Ab,c,de!"],"ed,c,bA!"]], sol:`def rev_keep(s):\n    s = list(s)\n    i, j = 0, len(s) - 1\n    while i < j:\n        if not s[i].isalpha(): i += 1\n        elif not s[j].isalpha(): j -= 1\n        else:\n            s[i], s[j] = s[j], s[i]\n            i += 1; j -= 1\n    return "".join(s)`},
{t:"Largest number from array", lv:3, fn:"largest_number", s:"Arrange numbers to form the largest possible number, as a string. (Repo Q67.)", ex:'largest_number([3,30,34,5,9]) -> "9534330"', hint:"Custom compare: a+b vs b+a as strings.", tests:[[[[3,30,34,5,9]],"9534330"],[[[10,2]],"210"]], sol:`def largest_number(a):\n    s = [str(v) for v in a]\n    n = len(s)\n    for i in range(n):\n        for j in range(n - 1 - i):\n            if s[j] + s[j+1] < s[j+1] + s[j]:\n                s[j], s[j+1] = s[j+1], s[j]\n    return "".join(s)`},

["Tokenisation","Splitting text into units (words, subwords). Modern models use subword tokenisers (BPE, WordPiece) so rare words become pieces. Your RAG assistant chunks text before embedding; chunk size is a tokenisation decision."],
["Stop words","High-frequency words (the, is) removed in classic pipelines because they carry little signal. Transformers keep them; attention learns what matters."],
["Stemming vs lemmatisation","Stemming chops suffixes by rule (running → run, studies → studi). Lemmatisation maps to the dictionary form using vocabulary and POS (studies → study). Lemmatisation is slower but cleaner."],
["Bag of words","Represent a document as word counts, order ignored. Simple, sparse, no meaning of similarity between words."],
["TF-IDF","Term frequency × inverse document frequency. Up-weights words frequent in this document but rare across the corpus. Still a strong baseline for classification."],
["Word embeddings","Dense vectors where similar words are close. word2vec learns them by predicting context words. all-MiniLM-L6-v2, used in your RAG project, produces sentence embeddings the same way at sentence level."],
["Cosine similarity","Angle-based similarity between vectors, 1 = same direction. Used by your vector store to retrieve the chunks closest to the question."],
["Attention","Each token computes a weighted sum over all other tokens; the weights come from query·key dot products. Lets the model relate 'it' to the noun it refers to regardless of distance."],
["Transformer","Stacked layers of self-attention plus feed-forward networks with residuals and layer norm. No recurrence, so it parallelises on GPUs."],
["BERT vs GPT","BERT is an encoder trained with masked-word prediction; good for classification and NER. GPT is a decoder trained to predict the next token; good for generation. Your RAG answerer is a GPT-style model."],
["Pretraining vs fine-tuning","Pretrain on huge general text; fine-tune on a small labelled task set. Fine-tuning changes weights; prompting does not."],
["Inference","Running a trained model on new input. The job post is about making this fast and reliable: latency, throughput, GPU memory."],
["Latency vs throughput","Latency: time for one request. Throughput: requests per second. Batching raises throughput but can raise latency. Say how you would measure both: p50/p95 latency, requests per second under load."],
["Quantisation","Store weights in fewer bits (float16, int8, int4). Smaller memory, faster inference, small accuracy loss. Ollama models you used are quantised GGUF files."],
["GPU utilisation","Percentage of time the GPU is busy. Low utilisation with high latency usually means the CPU side (tokenisation, data loading) is the bottleneck."],
["Data drift","Input distribution changes after deployment, so model quality drops without any code change. Monitor input statistics and prediction distributions. Your microbiome batch-artefact finding is the same idea: the data changed, not the biology."],
["Overfitting","Model memorises training data, fails on new data. Detect with a held-out validation set; fix with more data, regularisation, simpler model. LASSO in your Cox model is regularisation."],

{id:"c", t:"2. Reading C for the written test", min:60, pri:"Day 1 to 7. Round 1 is C output. You read C, you do not write it.", h:`
<p>Zoho's paper gives a C snippet and asks what it prints. You need six rules.</p>
<p><b>Rule 1: printf formats.</b> <code>%d</code> integer, <code>%c</code> one character, <code>%s</code> string from a pointer to the null terminator, <code>%f</code> float. <code>printf</code> returns the number of characters it printed.</p>
<p><b>Rule 2: ++ before or after.</b> <code>y = x++</code> gives y the old x, then x grows. <code>y = ++x</code> grows x first. Two ++ on the same variable in one statement, or in the same printf, is <i>undefined</i>: write that word.</p>
<p><b>Rule 3: arrays and pointers are the same thing in disguise.</b> <code>a[i]</code> is <code>*(a+i)</code>. <code>a</code> alone is the address of <code>a[0]</code>. <code>p+1</code> moves one element, not one byte. <code>*p++</code> reads then moves the pointer; <code>(*p)++</code> increments the value.</p>
<p><b>Rule 4: sizeof vs strlen.</b> <code>sizeof("hello")</code> is 6 (counts \\0). <code>strlen</code> is 5. <code>sizeof(int)</code> is 4. <code>sizeof('A')</code> is 4 in C because a char constant is an int. A pointer is 8 bytes on 64-bit.</p>
<p><b>Rule 5: static and recursion.</b> A <code>static</code> local keeps its value between calls. In recursion, a print before the recursive call prints going down (3 2 1); after the call prints coming back (1 2 3).</p>
<p><b>Rule 6: traps.</b> <code>if(a=0)</code> is assignment, false. <code>switch</code> without <code>break</code> falls through. <code>for(...);</code> with a semicolon is an empty loop. <code>7/2</code> is 3. <code>-7%3</code> is -1. <code>010</code> is octal 8. Character maths: <code>'A'+1</code> is 'B', <code>'a'-32</code> is 'A'.</p>
<p><b>Method on paper:</b> write the variables in a table, run each line by hand, update the table. Never guess. If it is undefined behaviour, say so; examiners accept "undefined" for those and it shows you know C.</p>
<p><b>Do now:</b> C output tab, 15 questions. Read every explanation.</p>`},

{id:"oop", t:"3. Object-oriented programming", min:60, pri:"Day 8. Needed for round 3 and the interview.", h:`
<p>A <b>class</b> is a blueprint. An <b>object</b> is one thing made from it. Zoho's round 3 is entirely this, and the interviewer will ask the four pillars.</p>
<pre>class Account:
    def __init__(self, name, balance=0):     # constructor
        self.name = name                     # attribute
        self.balance = balance

    def deposit(self, amt):                  # method
        if amt <= 0:
            raise ValueError("amount must be positive")
        self.balance += amt

    def withdraw(self, amt):
        if amt > self.balance:
            raise ValueError("insufficient funds")
        self.balance -= amt

a = Account("Sreya", 100)
a.deposit(50)
print(a.balance)    # 150</pre>
<p><b>The four pillars, each with your example:</b></p>
<ul>
<li><b>Encapsulation:</b> data and the methods that change it live together. Nobody sets <code>balance</code> directly; they call <code>deposit</code>, which validates. In Python a leading underscore (<code>self._balance</code>) signals "private".</li>
<li><b>Abstraction:</b> the caller knows <i>what</i> deposit does, not <i>how</i>. Your RAG assistant's "provider-agnostic LLM layer" is abstraction: the same <code>generate()</code> call works for Ollama or vLLM.</li>
<li><b>Inheritance:</b> a child class reuses a parent. <code>class Savings(Account)</code> gets deposit and withdraw for free and adds <code>add_interest</code>.</li>
<li><b>Polymorphism:</b> the same method name behaves differently per class. <code>Savings.withdraw</code> can override to block overdraft while <code>Current.withdraw</code> allows 5000.</li>
</ul>
<pre>class Savings(Account):
    def add_interest(self, rate):
        self.balance += self.balance * rate / 100

class Current(Account):
    def withdraw(self, amt):                  # override
        if amt > self.balance + 5000:
            raise ValueError("overdraft limit")
        self.balance -= amt</pre>
<p><b>Class vs instance:</b> <code>Account</code> is the class; <code>a</code> is an instance. <code>self</code> is "this particular object".</p>
<p><b>Do now:</b> write Account, Savings, Current yourself in VS Code and a menu loop that creates accounts and deposits. That is the first third of the Banking build brief.</p>`},

{id:"dsa", t:"4. Data structures and algorithms, the ones Zoho asks", min:90, pri:"Days 4 to 13, in pieces.", h:`
<p><b>Big-O</b> is how the work grows with input size n. Say it for every solution you write.</p>
<table><tr><th>Operation</th><th>Time</th></tr>
<tr><td>Look up dict key, append to list</td><td>O(1)</td></tr>
<tr><td>Binary search in sorted list</td><td>O(log n)</td></tr>
<tr><td>One loop over n items, linear search</td><td>O(n)</td></tr>
<tr><td>Good sort (merge, Python's sorted)</td><td>O(n log n)</td></tr>
<tr><td>Nested loops, bubble sort</td><td>O(n²)</td></tr></table>
<p><b>List</b>: ordered, index in O(1), insert in the middle O(n). <b>Linked list</b>: each node points to the next, insert O(1) if you have the node, index O(n). Say: "lists for random access, linked lists for many insertions at known positions".</p>
<p><b>Stack</b> (last in, first out): <code>st.append(x)</code>, <code>st.pop()</code>. Use for brackets, undo, recursion by hand. <b>Queue</b> (first in, first out): <code>from collections import deque; q.append(x); q.popleft()</code>. Use for BFS, waiting lists, taxi queue.</p>
<p><b>Hash map</b> (dict): key → value in O(1) on average by hashing the key to a slot. Collision: two keys, one slot; handled by chaining. Worst case O(n). Sets are dicts without values.</p>
<p><b>Recursion</b>: a function calling itself with a smaller input and a base case that stops it. Without the base case: infinite recursion, stack overflow.</p>
<pre>def fact(n):
    if n <= 1: return 1          # base case
    return n * fact(n - 1)</pre>
<p><b>Sorting by hand</b> (Zoho often bans sorted()):</p>
<pre>def bubble(a):
    n = len(a)
    for i in range(n):
        for j in range(n - 1 - i):
            if a[j] > a[j+1]:
                a[j], a[j+1] = a[j+1], a[j]
    return a</pre>
<p><b>Binary search</b>: sorted list, look at the middle, discard half.</p>
<p><b>Two pointers</b>: one index from each end. Palindromes, reversing in place, merging sorted lists.</p>
<p><b>Sliding window</b>: keep a window of k items and move it. Max of window minimums.</p>
<p><b>Tree</b>: nodes with children, no cycles. Family tree brief is this. <b>Graph</b>: nodes and edges. <b>BFS</b> explores level by level with a queue (shortest path in a grid). <b>DFS</b> goes deep with a stack or recursion (islands, flood fill). <b>Topological sort</b>: order tasks so prerequisites come first; count indegrees, repeatedly take a node with indegree 0.</p>
<p><b>Matrix</b>: list of lists, <code>m[r][c]</code>. Spiral, rotate, transpose, search a sub-block. Practise all four.</p>
<p><b>Do now:</b> Coding tab Level 2. Say the Big-O aloud after each.</p>`},

{id:"method", t:"5. How to attack a coding problem, and how to talk", min:20, pri:"Read before every coding session.", h:`
<ol>
<li><b>Read twice.</b> Underline input, output, constraints. Write the example by hand and check you get the sample output on paper.</li>
<li><b>Say the brute force first.</b> "I could try every pair, that's O(n²)." Then ask yourself if a dict, a sort, or two pointers removes a loop.</li>
<li><b>Write the function skeleton</b> with the return type before the logic.</li>
<li><b>Code the happy path.</b> Then edge cases: empty input, one element, all same, negative numbers.</li>
<li><b>Trace once by hand</b> with the sample before running.</li>
<li><b>Run tests.</b> If it fails, print intermediate values; do not stare.</li>
</ol>
<p><b>Talking while coding.</b> Zoho evaluators walk around rounds 2 and 3 and score explanation. Practise saying, in this order: what the problem asks in one sentence, your approach in one sentence, the Big-O, one edge case you handled. Thirty seconds. Silence reads as confusion.</p>
<p><b>When stuck:</b> say what you know, what you tried, and what you would try next. That gets partial marks; silence gets zero.</p>
<p><b>Two clean beats five half-done.</b> Move on only when tests pass and the code is readable.</p>`},

{id:"build", t:"6. The machine round method", min:30, pri:"Read before day 9.", h:`
<p>You get a brief like "railway reservation with these modules" and 3 to 4 hours. Most candidates fail here. The method:</p>
<p><b>Minutes 0 to 20, paper only.</b> List the <b>entities</b> (Passenger, Ticket, Train) with their fields. List the <b>functions</b> the menu needs (book, cancel, show, report). Pick <b>data structures</b>: usually a dict keyed by id plus a list for order. Write the menu options.</p>
<p><b>Minutes 20 to 60: skeleton.</b> Classes with fields, empty methods, the menu loop. Run it. It should show the menu and exit.</p>
<pre>class Booking:
    def __init__(self):
        self.tickets = {}        # id -> dict
        self.next_id = 1
        self.rac = []            # queue
        self.waiting = []

    def book(self, name, age, pref):
        ...

def main():
    b = Booking()
    while True:
        print("1 Book  2 Cancel  3 Show  4 Available  5 Exit")
        ch = input("> ").strip()
        if ch == "1":
            name = input("Name: ")
            try:
                age = int(input("Age: "))
            except ValueError:
                print("Age must be a number"); continue
            print(b.book(name, age, input("Berth L/M/U: ").upper()))
        elif ch == "5":
            break
        else:
            print("Invalid option")
main()</pre>
<p><b>Hours 1 to 2.5: one module at a time,</b> test each from the menu before the next. Book first, then show, then cancel, then reports.</p>
<p><b>Last 30 minutes:</b> bad input everywhere, then read the code top to bottom and rename anything unclear.</p>
<p><b>The change request.</b> At about 2 hours the evaluator changes a rule. If your logic lives in small methods, it is a 10-minute change. If it is in one giant function, you are done. Keep methods under 25 lines.</p>
<p><b>What they score:</b> working core flows, modularity, invalid input handled, how fast you absorb the change, and whether you can explain the design.</p>`},
];

{id:"linux", t:"7. Linux essentials", min:60, pri:"Days 13 and 16. A DevOps interviewer may ask; the written test will not.", h:`
<p>Linux is the operating system almost every server and every GPU box runs. A DevOps engineer lives in its terminal. You already use a Unix shell on your Mac; the commands are the same.</p>
<p><b>Files and directories.</b></p>
<pre>pwd                # where am I
ls -l              # list with details
cd /var/log        # move
cp a.txt b.txt     # copy      cp -r dir1 dir2 for directories
mv a.txt c.txt     # move or rename
rm a.txt           # delete    rm -r dir (careful)
mkdir logs
cat file  |  head -20 file  |  tail -f file   # tail -f follows a growing log
find / -name "*.log"
which python3      # path of a command</pre>
<p><b>ls -l fields</b>: <code>-rwxr-xr-- 1 sreya staff 4096 Sep 22 10:00 run.sh</code> → type and permissions, link count, owner, group, size, modified time, name. Hidden files start with a dot; <code>ls -a</code> shows them.</p>
<p><b>Permissions.</b> Three groups (owner, group, others) × three rights (read 4, write 2, execute 1). <code>chmod 755 run.sh</code> = owner rwx, others r-x. <code>chmod +x</code> makes executable. <code>chown user:group file</code> changes owner. <code>sudo</code> runs one command as root.</p>
<p><b>Pipes and redirection.</b> <code>|</code> sends one command's output into the next. <code>&gt;</code> writes output to a file (overwrite), <code>&gt;&gt;</code> appends, <code>2&gt;</code> redirects errors, <code>2&gt;&amp;1</code> sends errors to the same place as output.</p>
<pre>grep -i error app.log | wc -l          # count error lines
ps aux | grep python                    # find a running process
python3 train.py > out.log 2>&1 &       # run in background, log everything</pre>
<p><b>Processes.</b> <code>ps aux</code> lists them, <code>top</code> or <code>htop</code> shows live CPU and memory, <code>kill PID</code> stops one, <code>kill -9</code> forces. <code>nvidia-smi</code> is the GPU equivalent of top: utilisation, memory, which process holds the GPU. Say that in the interview; it is exactly the job post's "monitor GPU utilisation".</p>
<p><b>"The system is slow."</b> Check in order: <code>top</code> for CPU and memory, <code>df -h</code> for disk full, <code>iostat</code> for disk wait, <code>free -h</code> for swap. Load vs utilisation: load is how many processes want CPU; utilisation is how busy it is.</p>
<p><b>Services and logs.</b> <code>systemctl start|stop|status nginx</code>. Logs under <code>/var/log</code>; <code>journalctl -u nginx</code> for a service. <code>cron</code> schedules tasks: <code>crontab -e</code>, line <code>0 2 * * * /path/backup.sh</code> runs at 2 AM daily.</p>
<p><b>SSH.</b> <code>ssh user@host</code> logs into a remote machine over an encrypted channel; <code>scp file user@host:/path</code> copies. Better than telnet because telnet sends passwords in plain text. SSH key pairs replace passwords. "Host key verification failed" means the server's identity changed since you last connected.</p>
<p><b>Environment.</b> <code>echo $PATH</code>, <code>export VAR=value</code>, <code>env</code>. A shell script is a file of commands starting with <code>#!/bin/bash</code>.</p>
<p><b>Do now:</b> CS MCQ tab, Linux questions.</p>`},

{id:"osnet", t:"8. Operating systems and networking basics", min:45, pri:"Day 13. Interview questions, one line each.", h:`
<p><b>Process vs thread.</b> A process is a running program with its own memory. A thread runs inside a process and shares its memory with other threads. Threads are cheaper to create and can talk through shared variables, but need locks.</p>
<p><b>Deadlock.</b> Two threads each hold a lock the other needs; neither proceeds. Four conditions: mutual exclusion, hold and wait, no preemption, circular wait. Break any one to prevent it, usually by always acquiring locks in the same order.</p>
<p><b>Memory.</b> Stack: function calls and local variables, freed automatically. Heap: objects that outlive a function, freed by the garbage collector in Python or by <code>free()</code> in C. Virtual memory lets each process think it has the whole RAM; the OS pages to disk when RAM runs out, which is why swap makes machines crawl.</p>
<p><b>Scheduling.</b> The OS switches the CPU between processes (context switch). Round robin gives each a time slice.</p>
<p><b>Kernel vs user space.</b> The kernel talks to hardware; programs ask it through system calls (open, read, write).</p>
<p><b>Networking, layer by layer.</b> IP address identifies a machine; a port identifies a program on it (80 HTTP, 443 HTTPS, 22 SSH). DNS turns a name into an IP. TCP guarantees delivery and order with a handshake (web, SSH). UDP just sends, faster, may drop (video, DNS). HTTP is request/response text on top of TCP: a client sends GET or POST to a URL, the server returns a status (200 ok, 404 not found, 500 server error) and a body, often JSON.</p>
<p><b>REST API.</b> URLs are nouns (<code>/models/3</code>), HTTP verbs are actions (GET read, POST create, PUT update, DELETE). Your deployed ML model would be a POST to <code>/predict</code> with JSON in and JSON out.</p>
<p><b>SSH vs SSL/TLS.</b> SSH is for logging into machines; TLS encrypts HTTP to make HTTPS. Both use public-key cryptography.</p>
<p><b>Latency vs bandwidth.</b> Latency is delay per request; bandwidth is how much data per second. A model server cares about latency (p95, the slowest 5%) and throughput (requests per second).</p>`},

{id:"devops", t:"9. DevOps and MLOps concepts, and why each exists", min:45, pri:"Day 16. Understand the why; do not try to install everything on the 2015 Air.", h:`
<p>DevOps is the practice of making code go from a laptop to production reliably and repeatedly. Each tool solves one failure that used to happen by hand.</p>
<p><b>Git</b> solves "which version is this?". Commit is a snapshot, push sends it to GitHub, pull fetches others' work, branch is a parallel line of work, merge joins it. You use this already for study-room.</p>
<p><b>Docker</b> solves "it works on my machine". A <i>Dockerfile</i> lists the OS, dependencies and code; building it makes an <i>image</i>; running the image makes a <i>container</i>, an isolated process that behaves the same on any machine. For ML: the image holds Python, PyTorch, the model file and the serving code, so the GPU server runs exactly what you tested.</p>
<pre>FROM python:3.11
COPY requirements.txt .
RUN pip install -r requirements.txt
COPY app.py model.pt .
CMD ["python", "app.py"]</pre>
<p><b>CI/CD</b> solves "someone forgot to run the tests". CI (continuous integration): every push triggers an automatic build and test run (GitHub Actions, Jenkins). CD (continuous delivery/deployment): if tests pass, the build is deployed automatically. For ML add: retrain on new data, evaluate, deploy only if the metric did not drop.</p>
<p><b>Kubernetes</b> solves "run 50 copies of this container and restart the ones that die". It schedules containers across machines and scales them. One sentence is enough for this interview.</p>
<p><b>Terraform</b> solves "we built the servers by clicking and nobody remembers how". Infrastructure as code: a text file describes the servers, network and storage, and Terraform creates them. Repeatable, reviewable in Git.</p>
<p><b>Monitoring</b> solves "we found out from the users". Prometheus collects metrics (latency, error rate, GPU utilisation), Grafana graphs them, alerts fire on thresholds. For ML add data drift: the input distribution today vs training time.</p>
<p><b>MLOps specifically</b>, matching the job post line by line: data preparation pipelines (versioned datasets), model registry (which model file is in production), serving (vLLM, Triton, or a FastAPI app), optimisation (quantisation, batching, caching), monitoring (latency, throughput, GPU, drift, failures).</p>
<p><b>How to answer "have you used Docker?"</b> honestly: "Not in production. I understand it packages the app and its dependencies into an image so the model server runs identically anywhere, and I have used the same idea with Ollama model files and a pinned requirements file. I would learn the Dockerfile for my RAG app in my first week."</p>`},

{id:"ml", t:"10. ML and NLP for the ZLabs round", min:60, pri:"Days 15 and 16. This is where you outscore the room.", h:`
<p><b>What a model is.</b> A function with millions of numbers (weights) tuned so that input → correct output on training data. <b>Training</b> adjusts the weights by gradient descent to lower a loss. <b>Inference</b> runs the trained function on new input. The job is mostly about inference.</p>
<p><b>The pipeline.</b> Collect data → clean and label → split into train / validation / test → choose features or a model → train → evaluate on validation, tune → test once → deploy → monitor. Your gastric-cancer work is this pipeline in R; say so.</p>
<p><b>Overfitting.</b> Model memorises training data, fails on new data. Detect: training score high, validation low. Fix: more data, regularisation (your LASSO), simpler model, early stopping.</p>
<p><b>Metrics.</b> Accuracy misleads on imbalanced data. Precision: of the ones I flagged, how many were right. Recall: of the real positives, how many I found. F1 is their harmonic mean. Confusion matrix holds all four counts. For survival models, C-index (you have 0.61).</p>
<p><b>Classic NLP.</b> Tokenise → remove stop words → stem or lemmatise → bag of words or TF-IDF vector → logistic regression or naive Bayes. Still a strong baseline and fast.</p>
<p><b>Embeddings.</b> Dense vectors where meaning is geometry: similar texts are close (cosine similarity). word2vec for words; sentence-transformers for sentences. You used all-MiniLM-L6-v2: 384 dimensions, fast on CPU.</p>
<p><b>Transformer.</b> Reads all tokens at once. <i>Attention</i> lets each token weigh every other token, so "it" can attend to the noun it refers to. Stacked layers of attention + feed-forward. Encoder models (BERT) understand: classification, NER. Decoder models (GPT, Llama) generate: next token prediction. Fine-tuning adjusts a pretrained model on your labelled task.</p>
<p><b>NER and extraction</b>, likely ZLabs' real task: label spans in text (PERSON, DATE, AMOUNT) as B/I/O tags per token, fine-tune BERT as token classification, evaluate with F1 per entity type.</p>
<p><b>RAG</b>, your project: chunk documents → embed → store in a vector index → embed the question → retrieve top-k chunks → put them in the prompt → LLM answers with citations. Why: private data, fewer hallucinations, no retraining. Design choices you made: chunk size, k, embedding model, provider-agnostic generation.</p>
<p><b>Deployment vocabulary from the job post.</b> Latency (time per request, report p50 and p95), throughput (requests/second), batching (group requests to use the GPU fully), quantisation (int8/int4 weights for less memory and faster inference; your Ollama GGUF files are this), GPU utilisation (nvidia-smi), data drift (inputs shift from training distribution; monitor input statistics), failures (timeouts, out-of-memory, alert on error rate).</p>
<p><b>Seminar prep.</b> Be able to talk for 10 minutes with a paper diagram on either "how RAG works" or "how a transformer works". Practise aloud twice.</p>`},

{id:"projects", t:"11. Your projects, explained the way an interviewer wants", min:60, pri:"Day 15. Twenty minutes of the technical interview is your resume.", h:`
<p>For each project, the shape is: problem, your role, how it works, one design decision and why, one thing that broke, what you would do next. Two minutes each. Practise aloud.</p>
<h3>RAG Document Q&A Assistant</h3>
<p><b>Problem:</b> answer questions over a user's own PDFs with citations, without sending data to a hosted model if they do not want to. <b>Role:</b> sole developer. <b>How:</b> ingest PDF/text → split into chunks → embed each with all-MiniLM-L6-v2 → store vectors → embed question → cosine similarity top-k → build a prompt with those passages → stream the answer with [n] citations. <b>Decision:</b> a provider-agnostic LLM layer, so Ollama locally or vLLM hosted is a config change; chosen because users have different privacy and cost needs. <b>Broke:</b> be ready with a real one: chunks that split mid-sentence gave irrelevant retrieval, or long PDFs made ingestion slow; explain the fix you made. <b>Next:</b> evaluation set of question/answer pairs to measure retrieval recall, Docker image, batching embeddings.</p>
<p><b>Likely follow-ups:</b> why that embedding model (small, CPU-friendly, good enough for English); what chunk size and why; how would 100 users at once work (queue, batch embeddings, cache, more workers); how do you know the answer is grounded (citations, and a check that the answer's sentences map to retrieved chunks).</p>
<h3>Gastric cancer multi-omics pipeline</h3>
<p><b>Problem:</b> find a prognostic gene signature and a fibroblast programme in gastric cancer that hold up across cohorts. <b>Role:</b> led it end to end. <b>How:</b> eight public datasets (TCGA, GTEx, GEO cohorts, single-cell, microbiome, GWAS) pulled and harmonised in one R pipeline; LASSO-Cox with nested cross-validation for a 25-gene signature; WGCNA for co-expression modules; external validation. <b>Decision:</b> nested CV so the reported C-index is honest, not tuned on the test set. <b>Broke:</b> a microbiome signal looked biological and was a sequencing-batch artefact; you detected it by comparing distributions across batches. Frame it as data drift and QA. <b>Next:</b> submit the manuscript.</p>
<p><b>Follow-ups:</b> what is LASSO (L1 penalty shrinks weak coefficients to zero: feature selection + regularisation); why C-index 0.61 is modest and what that means; how you would productionise the pipeline (containerise, version data, schedule).</p>
<h3>KRAS G12D de novo design</h3>
<p><b>Problem:</b> generate novel small molecules for a hard cancer target. <b>Role:</b> solo. <b>How:</b> generate candidates, dock with DiffDock against the pocket, filter by drug-likeness and novelty against ChEMBL, with an approved drug as positive control at every step. <b>Decision:</b> the positive control, so every filter had a sanity check. <b>Broke:</b> some molecules docked outside the pocket; you excluded them explicitly. <b>Next:</b> more docking runs, MD validation.</p>
<h3>Unalone and DuoGrow</h3>
<p>Say exactly what you built: Unalone frontend (chat interface, peer connect, actions) in JavaScript; DuoGrow team lead (concept, split work, drove submission). Do not claim the backend. If asked what you would do differently: write tests, define the API contract first.</p>
<p><b>Do now:</b> Interview tab, write all project answers, then record yourself saying them.</p>`},

{id:"sql", t:"12. SQL in one hour", min:45, pri:"Day 16. One or two queries in the technical interview.", h:`
<pre>-- tables: customers(id, name, city)   orders(id, customer_id, amount, order_date)
SELECT name, city FROM customers WHERE city = 'Chennai';
SELECT COUNT(*) FROM orders;
SELECT customer_id, SUM(amount) AS total
FROM orders
GROUP BY customer_id
ORDER BY total DESC
LIMIT 3;                                  -- top 3 customers by spend
SELECT c.name, o.amount
FROM customers c
JOIN orders o ON o.customer_id = c.id;    -- inner join: only matching rows
SELECT c.name, o.amount
FROM customers c
LEFT JOIN orders o ON o.customer_id = c.id;  -- left join: all customers, NULL if no order
SELECT city, COUNT(*) FROM customers GROUP BY city HAVING COUNT(*) > 1;
SELECT * FROM orders WHERE amount > (SELECT AVG(amount) FROM orders);   -- subquery</pre>
<p><b>Order of clauses:</b> SELECT, FROM, JOIN, WHERE, GROUP BY, HAVING, ORDER BY, LIMIT. WHERE filters rows before grouping; HAVING filters groups after.</p>
<p><b>Keys.</b> Primary key: unique id per row. Foreign key: a column that references another table's primary key (orders.customer_id).</p>
<p><b>Normalisation</b> in one line each. 1NF: one value per cell, no lists. 2NF: every non-key column depends on the whole primary key. 3NF: non-key columns do not depend on other non-key columns. Purpose: no duplicated facts, so an update happens in one place.</p>
<p><b>Index.</b> A sorted structure on a column that makes WHERE and JOIN on it fast, at the cost of slower writes.</p>`},

{id:"apt", t:"13. Aptitude shortcuts", min:30, pri:"Days 3 to 6 alongside the drills.", h:`
<p><b>Percentages.</b> x% of y = xy/100. Increase by 20% then decrease by 20% is not back to start: ×1.2×0.8 = 0.96, a 4% loss. Successive discounts a% and b%: total = a + b − ab/100.</p>
<p><b>Profit and loss.</b> Profit% = (SP − CP)/CP × 100. Always on cost price unless told otherwise.</p>
<p><b>Ratio.</b> Split total T in ratio a:b → parts T·a/(a+b) and T·b/(a+b).</p>
<p><b>Averages.</b> Sum = average × count. Removing one number: new average = (sum − x)/(n − 1).</p>
<p><b>Time and work.</b> Convert to rates: A does 1/10 per day, B 1/15 → together 1/6 → 6 days. Men × days = constant for the same work.</p>
<p><b>Speed.</b> Distance = speed × time. km/h to m/s: multiply by 5/18. Train passing a pole: distance = its own length. Average speed = total distance / total time, never the average of speeds. Boats: downstream speed = boat + river, upstream = boat − river.</p>
<p><b>Interest.</b> Simple: PRT/100. Compound: P(1 + R/100)^T − P. Two-year CI at 10% on 1000 = 210.</p>
<p><b>Counting.</b> nPr = n!/(n−r)! (order matters). nCr = n!/(r!(n−r)!) (order does not). Handshakes among n people = nC2.</p>
<p><b>Probability.</b> Favourable / total. Two dice: 36 outcomes; sum 7 is the most likely (6 ways). Without replacement: multiply successive fractions with the denominator shrinking.</p>
<p><b>Number tricks.</b> Unit digit cycles (7: 7,9,3,1). Sum 1..n = n(n+1)/2. First n odd numbers sum to n². Numbers divisible by 3: digit sum divisible by 3. HCF × LCM = product of the two numbers.</p>
<p><b>Clock.</b> Hour hand 0.5° per minute, minute hand 6° per minute. Angle at h:m = |30h − 5.5m|.</p>
<p><b>Series.</b> Check differences, then differences of differences, then ratios, then squares/cubes, then alternating two series.</p>`}
);

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let store = {};
try { store = JSON.parse(localStorage.getItem("zoho-prep") || "{}"); } catch(e) { store = {}; }
function save(){ try { localStorage.setItem("zoho-prep", JSON.stringify(store)); } catch(e){} }
function today(){ return new Date().toISOString().slice(0,10); }
function log(kind, id, ok){
  store.log = store.log || [];
  store.log.push({d:today(), k:kind, id, ok:ok?1:0});
  store.days = store.days || {}; store.days[today()] = 1;
  if(!ok){ store.wrong = store.wrong || {}; store.wrong[kind+":"+id] = (store.wrong[kind+":"+id]||0)+1; }
  else if(store.wrong && store.wrong[kind+":"+id]){ delete store.wrong[kind+":"+id]; }
  save();
}
function norm(s){ return String(s).trim().toLowerCase().replace(/\s+/g," "); }
function accept(user, item){
  const u = norm(user); if(!u) return false;
  if(u === norm(item.a)) return true;
  if(item.alt && item.alt.some(x => u === norm(x) || u.includes(norm(x)))) return true;
  if(["undefined","unspecified","garbage","crash","negative"].includes(norm(item.a)) && u.includes(norm(item.a).slice(0,5))) return true;
  return false;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmt(s){ const m=Math.floor(s/60), r=s%60; return (m<10?"0":"")+m+":"+(r<10?"0":"")+r; }

// ---- GENERIC DRILL (C / APT) ----
function drill(kind, bank, render, n){
  let items = shuffle(bank.map((x,i)=>({...x, id:i})));
  const redo = Object.keys(store.wrong||{}).filter(k=>k.startsWith(kind+":")).map(k=>+k.split(":")[1]);
  items = [...items.filter(x=>redo.includes(x.id)), ...items.filter(x=>!redo.includes(x.id))].slice(0,n);
  let i=0, score=0;
  function show(){
    if(i>=items.length){ $("#view").innerHTML = `<div class="card ok"><b>Set done: ${score}/${items.length}</b><p class="small">${score>=items.length*0.75?"Good. Do another set.":"Below 75%. Read every explanation you missed before the next set."}</p><button class="b" onclick="nav('${kind==='c'?'c':'apt'}')">Another set</button></div>`; return; }
    const it = items[i];
    $("#view").innerHTML = `<div class="small">${kind==='c'?'C output':'Aptitude'} · ${i+1}/${items.length} · ${redo.includes(it.id)?'<span class="pill">redo</span>':''}</div>
    <div class="card">${render(it)}
    <input class="ans" id="ans" placeholder="Write the exact output / answer" autocomplete="off">
    <div class="row" style="margin-top:8px"><button class="b" id="chk">Check</button><button class="b s" id="skip">Don't know</button></div>
    <div id="fb"></div></div>`;
    $("#ans").focus();
    const check = (giveup)=>{
      const ok = !giveup && accept($("#ans").value, it);
      if(ok) score++;
      log(kind, it.id, ok);
      $("#fb").innerHTML = `<div class="card ${ok?'ok':'warn'}"><b>${ok?'Correct':'Answer: '+esc(it.a)}</b><div>${esc(it.ex)}</div><button class="b" id="next" style="margin-top:8px">Next</button></div>`;
      $("#chk").disabled = $("#skip").disabled = true;
      $("#next").focus(); $("#next").onclick = ()=>{ i++; show(); };
    };
    $("#chk").onclick = ()=>check(false); $("#skip").onclick = ()=>check(true);
    $("#ans").onkeydown = e=>{ if(e.key==="Enter" && !$("#chk").disabled) check(false); };
  }
  show();
}

// ---- CODING with Pyodide ----
let py = null, pyLoading = null;
function loadPy(){
  if(py) return Promise.resolve(py);
  if(pyLoading) return pyLoading;
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js";
  pyLoading = new Promise((res, rej)=>{
    s.onload = ()=> loadPyodide({indexURL:"https://cdn.jsdelivr.net/pyodide/v0.26.2/full/"}).then(p=>{ py=p; res(p); }).catch(rej);
    s.onerror = ()=>rej(new Error("Could not load Python runtime (needs internet)."));
  });
  document.head.appendChild(s);
  return pyLoading;
}
function coding(){
  const done = (store.log||[]).filter(x=>x.k==='code'&&x.ok).map(x=>x.id);
  $("#view").innerHTML = `<div class="card"><b>Round 2 practice</b><p class="small">Pick a problem, write Python in the box, run tests. Level 1 first. Time yourself: level 1 under 10 min, level 2 under 25, level 3 under 45. The first run downloads the Python runtime (about 10 MB); on the 2015 Air give it a minute.</p></div>` +
    [1,2,3].map(lv=>`<h3>Level ${lv}</h3><div class="grid">${CODE.map((p,i)=>({...p,i})).filter(p=>p.lv===lv).map(p=>`<button class="b s" style="text-align:left" onclick="openProblem(${p.i})">${done.includes(p.i)?'✓ ':''}${esc(p.t)}</button>`).join("")}</div>`).join("");
}
function openProblem(i){
  const p = CODE[i];
  const key = "code-src-"+i;
  let start = Date.now();
  $("#view").innerHTML = `<button class="b s" onclick="nav('code')">← problems</button>
  <div class="card"><div class="row" style="justify-content:space-between"><b>${esc(p.t)}</b><span class="timer" id="tm">00:00</span></div>
  <p>${esc(p.s)}</p><pre>${esc(p.ex)}</pre>
  <details><summary>Hint</summary><div class="small">${esc(p.hint)}</div></details>
  <details><summary>Reference solution (only after 3 honest attempts)</summary><pre>${esc(p.sol)}</pre></details>
  <textarea class="code" id="src" spellcheck="false">${esc(store[key] || ("def "+p.fn+"("+ (p.tests[0][0].length? p.tests[0][0].map((_,k)=>"arg"+(k+1)).join(", "):"") +"):\n    pass\n"))}</textarea>
  <div class="row"><button class="b" id="run">Run tests</button><span class="small" id="st"></span></div>
  <div class="out hidden" id="out"></div></div>`;
  window._t = setInterval(()=>{ $("#tm").textContent = fmt(Math.floor((Date.now()-start)/1000)); }, 1000);
  $("#src").oninput = ()=>{ store[key] = $("#src").value; save(); };
  $("#src").onkeydown = e=>{ if(e.key==="Tab"){ e.preventDefault(); const t=e.target, s=t.selectionStart; t.value = t.value.slice(0,s)+"    "+t.value.slice(t.selectionEnd); t.selectionStart=t.selectionEnd=s+4; } };
  $("#run").onclick = async ()=>{
    $("#st").textContent = "Loading Python…"; $("#run").disabled = true;
    try{
      const P = await loadPy();
      $("#st").textContent = "Running…";
      const src = $("#src").value;
      const tests = JSON.stringify(p.tests);
      const prog = `import json, traceback\n_out=[]\ntry:\n    exec(${JSON.stringify(src)}, globals())\n    for args, exp in json.loads(${JSON.stringify(tests)}):\n        try:\n            got = ${p.fn}(*args)\n            _out.append([json.dumps(args), json.dumps(exp), json.dumps(got, default=str), got == exp])\n        except Exception as e:\n            _out.append([json.dumps(args), json.dumps(exp), 'ERROR: '+repr(e), False])\nexcept Exception as e:\n    _out.append(['', '', 'ERROR: '+traceback.format_exc(), False])\njson.dumps(_out)`;
      const res = JSON.parse(await P.runPythonAsync(prog));
      const ok = res.every(r=>r[3]);
      $("#out").classList.remove("hidden");
      $("#out").innerHTML = res.map(r=>`<div class="${r[3]?'pass':'fail'}">${r[3]?'PASS':'FAIL'}  ${esc(p.fn)}(${esc(r[0].slice(1,-1))})  expected ${esc(r[1])}  got ${esc(r[2])}</div>`).join("") + (ok?`<div class="pass" style="margin-top:6px">All tests pass in ${$("#tm").textContent}. Now explain your approach aloud in 30 seconds, as if an evaluator is beside you.</div>`:"");
      log("code", i, ok);
      $("#st").textContent = ok ? "Solved" : "Not yet";
    }catch(e){ $("#out").classList.remove("hidden"); $("#out").textContent = "Error: "+e.message; $("#st").textContent=""; }
    $("#run").disabled = false;
  };
}

  const wrong = Object.keys(store.wrong||{});
  const mocks = (store.mocks||[]).map(m=>`<li>${m.d}: ${m.s}/20</li>`).join("") || "<li>None yet. Day 7 and day 14.</li>";
  const last7 = [...Array(7)].map((_,i)=>{ const d=new Date(); d.setDate(d.getDate()-i); const s=d.toISOString().slice(0,10); return (store.days||{})[s]?"■":"□"; }).reverse().join(" ");
  $("#view").innerHTML = `<div class="grid">${rows}</div>
  <div class="card"><b>Last 7 days</b><div style="font-size:20px;letter-spacing:4px">${last7}</div><span class="small">A missed day is the only real failure mode of this plan.</span></div>
  <div class="card"><b>Mock R1 scores</b><ul>${mocks}</ul></div>
  <div class="card"><b>To redo (${wrong.length})</b><p class="small">These come first in every drill until you get them right.</p>${wrong.slice(0,30).map(w=>{ const [k,id]=w.split(":"); const it = k==='c'?C[id]:k==='apt'?APT[id]:k==='code'?CODE[id]:k==='mcq'?MCQ[id]:NLP[id]; const label = k==='c'? (it.c.split("\n").slice(-1)[0]) : k==='apt'? it.q : k==='code'? it.t : it[0]; return `<div class="small">• [${k}] ${esc(label).slice(0,90)}</div>`; }).join("")}</div>
  <div class="card"><b>Readiness check</b><ul>
  <li>C output accuracy over last 30: ${(()=>{const a=L.filter(x=>x.k==='c').slice(-30); return a.length?Math.round(a.filter(x=>x.ok).length/a.length*100)+'%':'—';})()} (target 80%)</li>
  <li>Level-2 coding problems solved: ${CODE.map((p,i)=>({p,i})).filter(x=>x.p.lv===2 && L.some(l=>l.k==='code'&&l.id===x.i&&l.ok)).length}/${CODE.filter(p=>p.lv===2).length} (target 8)</li>
  <li>Build briefs completed: ${Object.keys(store.builds||{}).length} (target 2)</li>
  <li>Lessons read: ${Object.keys(store.lessons||{}).length}/${LESSONS.length}</li>
  <li>NLP cards known: ${Object.keys(store.nlpKnown||{}).length}/${NLP.length} (target all)</li></ul>
  <button class="b s" onclick="if(confirm('Erase all progress on this device?')){localStorage.removeItem('zoho-prep');location.reload();}">Reset progress</button></div>`;
}
nav("home");
</script>
</body>
